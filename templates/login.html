<!DOCTYPE html>
<!-- Coding By CodingNepal - youtube.com/codingnepal -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stylelogin.css') }}">
    <style>
      body{
  margin: 0;
  padding: 0;
  background-image: url('{{ url_for('static', filename='images/newBACK.jpg') }}');
  background-size: cover;
  /*background: linear-gradient(120deg,#2980b9, #8e44ad);*/
  height: 100vh;
  overflow: hidden;
}
    </style>
  </head>
  <body>
    <div class="center">
      <h1>Login</h1>
      {% if mesage is defined and mesage %}
      <div class="alert alert-warning">{{ mesage }}</div>
      {% endif %}
      <form action="{{ url_for('login') }}" method="post">

        <div class="txt_field">
          <input type="email"  id="email" name="email" required>
          <span></span>
          <label>Email</label>
        </div>
        <div class="txt_field">
          <input type="password" id="password" name="password" required>
          <span></span>
          <label>Password</label>
        </div>
        <div class="pass">Forgot Password?</div>
        <input type="submit" class="btn btn-primary" value="Login">
        <div class="signup_link">
          Not a member? <a href="{{url_for('register')}}">Signup</a>
        </div>
      </form>
    </div>

  </body>
</html>
