<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <!-- font awesome cdn link  -->
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
      <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">-->
       <link rel="stylesheet" href="https://unpkg.com/swiper@7/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
   <link rel="stylesheet" href="{{ url_for('static', filename='css/chatStyle.css') }}">
       <!-- custom css file link  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAT FITNESS</title>
</head>
<body><div id="popup-container">
  <div id="popup-content">
    <p>Please Chose A Response Type Before Starting Conversation!</p>
    <button id="close-popup">Understood!</button>
  </div>
</div>
<header class="header">

    <a href="/home" class="logo"><img class="imglogo" src="{{ url_for('static', filename='images/BRAND2/MAINLOGO.png') }}" /></a>

    <div id="menu-btn" class="fas fa-bars"></div>

    <nav class="navbar">
        <a href="/home">home</a>
        <a href="#about">about</a>
        <a onclick="location.href='#blogs'">articles</a>
		<a href="login"> <img class="imglog" src="{{ url_for('static', filename='images/loginRED2.png') }}" /></a>

    </nav></header>

<div class="container">
    <div class="menu">

          <img class="log_img1" src="{{ url_for('static', filename='images/people.png') }}" >
           <p class="sname">{{session.name}}</p>
          <p class="semail"> {{session.email}}</p>
        <a href="{{ url_for('logout') }}"><img class="logout" src="{{ url_for('static', filename='images/logout2.png') }}"/></a>
             </div>

    <div class="content">
         <div class="chat_content">
             <div class="chat_header">
                 <div><img src="{{ url_for('static', filename='images/chatbot.png') }}" alt="image"></div>
                <h2>Welcome to Chat Fitness</h2>
                 <br>

                 <div class="div_choice">
                     <button class="bimage">Image</button><button  class="btext">Text</button>
                 </div>


             </div>

             <div class="chat_part">

                 <div class="msg"></div>
             </div>
             <div class="chat_footer">
                     <input type="text" placeholder="How Can I help You ?" class="user_input"><img src="{{ url_for('static', filename='images/send.png') }}" class="on_send">
                 </div>
  </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/chatJS.js') }}"></script>
</body>
</html>
